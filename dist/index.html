<!doctype html>
<html lang="ja"> <!-- KIRIEMON QRコード作成ページ（トップページ）。入力文字をQRコードに変換して表示する。 -->
  <head>
    <meta charset="utf-8"> <!-- 文字コードの指定。日本語の文字化けを防ぐ。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"> <!-- スマホの画面幅に合わせる設定。 -->
    <meta name="description" content="入力した文字をブラウザー内でQRコードに変換し、大きく表示できます。"> <!-- 検索結果に表示される説明。 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; connect-src 'self'; form-action 'none'; base-uri 'none'"> <!-- 外部通信・外部スクリプトを禁止するCSP。connect-src 'self' は kana-db.json の読み込み用。 -->
    <title>KIRIEMON</title> <!-- ブラウザーのタブに表示されるタイトル。 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 4'%3E%3Cpath fill='%23181818' d='M0 0h2v2H0zm2 2h2v2H2z'/%3E%3C/svg%3E"> <!-- タブやブックマークに表示されるアイコン。 -->
    <link rel="stylesheet" href="styles.css"> <!-- 共通のスタイルシート。 -->
    <script defer src="vendor/qrcodegen-v1.8.0-es6.js"></script> <!-- QRコード生成ライブラリ。deferでHTML読み込み後に実行。 -->
    <script defer src="app.js"></script> <!-- ページの動き（検証・QR生成）を担当。 -->
  </head>
  <body>
    <main class="workspace"> <!-- 画面全体のコンテナ。中央寄せや余白はCSSで調整。 -->
      <header class="page-heading"> <!-- ページ上部の見出しエリア。 -->
        <div class="heading-bar"> <!-- 学校名と「使い方」チップを横に並べる行。 -->
          <h1>鶴城丘高校 技術部</h1> <!-- 学校名。 -->
          <a class="howto-link" href="howto.html">使い方</a> <!-- 使い方ページへのリンク。 -->
        </div>
        <p>KIRIEMON QRコード作成</p> <!-- ページの大きな見出し。 -->
      </header>

      <form id="qr-form" class="editor"> <!-- 文字を入力してQRコードを生成するフォーム。送信処理はapp.jsが担当。 -->
        <label for="qr-text" class="visually-hidden">打ちたい文字</label> <!-- スクリーンリーダー用のラベル（画面では非表示）。 -->
        <span id="qr-limit" class="visually-hidden">60字以内</span> <!-- スクリーンリーダー用の文字数制限の説明。 -->
        <div class="writing-area"> <!-- 入力欄と、波線を描く透明レイヤーを重ねる領域。 -->
          <div id="qr-markers" class="invalid-marker-layer" aria-hidden="true"></div> <!-- エラー箇所に波線を描く透明レイヤー。中身はapp.jsが作る。 -->
          <textarea id="qr-text" rows="4" placeholder="ここに文字を入力" spellcheck="false" autocapitalize="off" aria-describedby="qr-limit qr-hint qr-count qr-error"></textarea> <!-- 文字入力欄。入力量に合わせて高さが自動で広がる。 -->
        </div>
        <div class="field-details"> <!-- 入力ヒントと文字数カウンターの行。 -->
          <p id="qr-hint">ひらがな・カタカナ・句読点・「ー」・空白が使えます。</p> <!-- 使える文字のヒント。 -->
          <span id="qr-count" class="count">0 / 60</span> <!-- 文字数カウンター。 -->
        </div>
        <p id="qr-error" class="error" role="alert"></p> <!-- エラーメッセージの表示欄。role="alert"で読み上げられる。 -->
        <button class="generate-button" type="submit" aria-haspopup="dialog" disabled> <!-- QRコード生成ボタン。入力が不正なあいだは押せない。 -->
          <span>QRコードを生成</span> <!-- ボタンの文字。 -->
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg> <!-- 右向き矢印のアイコン。 -->
        </button>
      </form>
      <footer class="site-footer"> <!-- 商標・著作権の表示。 -->
        <small>QRコードは株式会社デンソーウェーブの登録商標です。</small> <!-- 商標表記。 -->
        <small>© 2026 鶴城丘高校 技術部</small> <!-- 著作権表示。 -->
      </footer>
      <noscript><p>QRコードの生成にはJavaScriptが必要です。</p></noscript> <!-- JavaScriptが無効な環境向けの案内。 -->
    </main>

    <dialog id="qr-dialog" class="qr-dialog" aria-labelledby="qr-heading"> <!-- 生成したQRコードを大きく表示するダイアログ。 -->
      <header class="dialog-heading"> <!-- ダイアログ上部の見出し行。 -->
        <span class="wordmark" aria-hidden="true">KIRIEMON</span> <!-- ロゴ文字。 -->
        <h2 id="qr-heading" class="visually-hidden">生成したQRコード</h2> <!-- スクリーンリーダー用の見出し。 -->
        <button id="qr-close" class="close-button" type="button" autofocus> <!-- ダイアログを閉じるボタン。 -->
          <span>閉じる</span> <!-- ボタンの文字。 -->
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg> <!-- ×アイコン。 -->
        </button>
      </header>
      <div class="qr-stage"> <!-- QRコード画像と説明文を表示する領域。 -->
        <img id="qr-image" class="qr-image" alt="生成したQRコード"> <!-- 生成したQRコードの画像。 -->
        <p id="qr-caption" class="qr-caption" aria-live="polite"></p> <!-- 入力どおりの文字。読み上げ対象。 -->
      </div>
    </dialog>
  </body>
</html>
